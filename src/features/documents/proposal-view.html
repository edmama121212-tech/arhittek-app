  <div class="view" id="view-kp">

    <div style="display:flex; align-items:center; gap:10px; margin-bottom:14px;">
      <button class="icon-btn" id="kpBack" style="font-size:20px;">←</button>
      <div style="font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:16px;">Коммерческое предложение</div>
    </div>

    <div class="section-label"><span class="lbl-text">Сохранённые КП</span><span class="section-label-line"></span></div>
    <div id="kpSavedList" class="card" style="margin-bottom:8px;"></div>
    <button class="btn btn-secondary" id="kpNewBtn" style="margin-bottom:10px;">+ Новое КП</button>

    <div class="section-label"><span class="lbl-text">Клиент</span><span class="section-label-line"></span></div>
    <div class="card">
      <div class="field">
        <label>Имя клиента</label>
        <input type="text" id="kp-client-name" placeholder="например: Иванов Иван Иванович">
      </div>
      <div class="field-row">
        <div class="field">
          <label>Телефон</label>
          <input type="text" id="kp-client-phone" placeholder="7 900 000-00-00">
        </div>
        <div class="field">
          <label>Дата</label>
          <input type="date" id="kp-date">
        </div>
      </div>
      <div class="field">
        <label>Объект / адрес</label>
        <input type="text" id="kp-object" placeholder="например: Грозный, ул. ...">
      </div>
      <div class="field-row">
        <div class="field">
          <label>Срок выполнения</label>
          <input type="text" id="kp-deadline" placeholder="например: 30 рабочих дней">
        </div>
        <div class="field">
          <label>Начало работ</label>
          <input type="text" id="kp-start" placeholder="например: после аванса">
        </div>
      </div>
      <div class="field">
        <label for="kp-comment">Комментарий для клиента</label>
        <textarea id="kp-comment" rows="3" maxlength="2000" placeholder="Например: в стоимость включены два варианта планировки"></textarea>
      </div>
    </div>

    <div class="section-label"><span class="lbl-text">Реквизиты в PDF и Excel</span><span class="section-label-line"></span></div>
    <div class="card kp-requisites" role="group" aria-label="Реквизиты в PDF и Excel">
      <label><input type="checkbox" id="kp-show-company" checked> Реквизиты компании (ИНН, ОГРН, адрес)</label>
      <label><input type="checkbox" id="kp-show-account"> Реквизиты расчётного счёта</label>
      <label><input type="checkbox" id="kp-show-card"> Банковская карта</label>
      <div id="kp-requisites-hint" class="hint" aria-live="polite" hidden></div>
    </div>

    <div class="section-label"><span class="lbl-text">Услуги</span><span class="section-label-line"></span></div>
    <div id="kpServicesList"></div>
    <button class="btn btn-secondary" id="kpAddService">+ Добавить услугу</button>

    <div class="section-label"><span class="lbl-text">Дополнительная скидка на всё КП</span><span class="section-label-line"></span></div>
    <div class="card">
      <div class="field-row">
        <div class="field">
          <label>Тип скидки</label>
          <select id="kp-discount-type">
            <option value="percent">% от суммы</option>
            <option value="fixed">Фиксированная сумма, ₽</option>
          </select>
        </div>
        <div class="field">
          <label>Размер скидки</label>
          <input type="number" id="kp-discount-value" placeholder="0">
        </div>
      </div>
    </div>

    <div class="section-label"><span class="lbl-text">Итог</span><span class="section-label-line"></span></div>
    <div class="card field">
      <label for="kp-advance-percent">Условия оплаты</label>
      <select id="kp-advance-percent">
        <option value="50">Аванс 50%, остаток 50%</option>
        <option value="100">Оплата 100% одним платежом</option>
      </select>
    </div>
    <div class="fee-card">
      <div class="fee-row"><div class="fl">Стоимость до скидок</div><div class="fv" id="kp-subtotal">0 ₽</div></div>
      <div class="fee-row kp-saving-row" id="kp-tariff-saving-row" hidden><div class="fl">Скидка на тарифы</div><div class="fv" id="kp-tariff-saving"></div></div>
      <div class="fee-row" id="kp-extra-discount-row" hidden><div class="fl">Дополнительная скидка</div><div class="fv" id="kp-discount-amount">0 ₽</div></div>
      <div class="fee-row total"><div class="fl">Итого к оплате</div><div class="fv" id="kp-total">0 ₽</div></div>
      <div class="fee-row remaining"><div class="fl" id="kp-advance-label">Аванс (50%)</div><div class="fv" id="kp-advance">0 ₽</div></div>
      <div class="fee-row"><div class="fl">Остаток</div><div class="fv" id="kp-remainder">0 ₽</div></div>
    </div>

    <button class="btn btn-primary" id="kpExportPdf">Скачать PDF</button>
    <button class="btn btn-secondary" id="kpExportXlsx">Скачать Excel</button>
    <button class="btn btn-secondary" id="kpSaveBtn" style="margin-top:8px;">💾 Сохранить КП</button>

  </div>

  <!-- ===================== КОМПАНИЯ (реквизиты) ===================== -->
