name: Regression

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Check cash accounting and payroll
        run: npm run test:finance

      - name: Run regression suite
        run: npm test

      - name: Check complete reads, public forms and app workflows
        run: npm run test:app

      - name: Check responsive interactions and audit regressions
        run: npm run test:ux
