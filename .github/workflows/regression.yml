name: Regression

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Check owner-only database permissions and employee ranks
        run: timeout 90s node tests/owner-access.cjs

      - name: Check owner-only screens and employee ranks on mobile
        run: timeout 90s node tests/owner-access-ui.cjs

      - name: Check server permissions, login compatibility and project isolation
        if: ${{ !cancelled() }}
        run: node tests/session-security.cjs && node tests/invoice-payment-atomic.cjs && node tests/employees-server-access.cjs

      - name: Check confirmed journal transactions, retries and mobile UI
        if: ${{ !cancelled() }}
        run: node tests/financial-journal.cjs && node tests/financial-journal-client.cjs && node tests/financial-journal-ui.cjs

      - name: Check contract tariffs, discounts and document exports
        if: ${{ !cancelled() }}
        run: node tests/contract-pricing.cjs && node tests/contract-pricing-ui.cjs && node tests/contract-customer.cjs && node tests/contract-customer-ui.cjs

      - name: Check cash accounting and payroll
        if: ${{ !cancelled() }}
        run: timeout 240s npm run test:finance

      - name: Run regression suite
        if: ${{ !cancelled() }}
        run: timeout 180s npm test

      - name: Check complete reads, public forms and app workflows
        if: ${{ !cancelled() }}
        run: timeout 240s npm run test:app

      - name: Check catalogue floors, basement and stored plans
        if: ${{ !cancelled() }}
        run: timeout 120s npm run test:catalog

      - name: Check PDF extraction, automatic import and duplicate protection
        if: ${{ !cancelled() }}
        run: timeout 180s npm run test:catalog:pdf && CATALOG_NO_STREAM_ITERATOR=1 timeout 180s npm run test:catalog:pdf

      - name: Check responsive interactions and audit regressions
        if: ${{ !cancelled() }}
        run: timeout 240s npm run test:ux && timeout 90s node tests/navigation-performance.cjs

      - name: Check construction accounting, access and customer portal
        if: ${{ !cancelled() }}
        run: timeout 240s npm run test:construction

  catalog-pdf-webkit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Install WebKit
        run: npx playwright install --with-deps webkit
      - name: Check mobile PDF import without stream async iteration
        env:
          CATALOG_BROWSER: webkit
          CATALOG_NO_STREAM_ITERATOR: '1'
        run: timeout 180s npm run test:catalog:pdf

